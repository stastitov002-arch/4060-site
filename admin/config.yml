          - label: "О компании"
            name: "about"
            widget: "object"
            fields:
              - { label: "Hero — надстрочник", name: "heroEyebrow", widget: "string" }
              - { label: "Hero — лид (можно HTML)", name: "heroLead", widget: "text" }
              - { label: "Hero — заголовок (можно HTML)", name: "heroTitle", widget: "text" }
