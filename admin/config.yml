              - { label: "«Что получаете» — надстрочник", name: "gainEyebrow", widget: "string" }
              - { label: "«Что получаете» — заголовок", name: "gainTitle", widget: "string" }
              - { label: "«Что получаете» — описание", name: "gainLead", widget: "text" }
              - { label: "«Как начать» — надстрочник", name: "stepsEyebrow", widget: "string" }
              - { label: "«Как начать» — заголовок", name: "stepsTitle", widget: "string" }
              - { label: "«Как начать» — описание", name: "stepsLead", widget: "text" }
              - { label: "Форма — надстрочник", name: "formEyebrow", widget: "string" }
              - { label: "Форма — заголовок", name: "formTitle", widget: "string" }
              - { label: "Форма — описание", name: "formLead", widget: "text" }
