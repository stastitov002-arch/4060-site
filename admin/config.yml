              - { label: "«Сроки» — заголовок", name: "termsTitle", widget: "string" }
              - { label: "«Сроки» — описание", name: "termsLead", widget: "text" }
              - { label: "«Обращение» — надстрочник", name: "howEyebrow", widget: "string" }
              - { label: "«Обращение» — заголовок", name: "howTitle", widget: "string" }
              - { label: "«Обращение» — описание", name: "howLead", widget: "text" }
              - { label: "CTA — заголовок (можно HTML)", name: "ctaTitle", widget: "text" }
