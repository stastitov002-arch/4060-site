              - { label: "Правая колонка — заголовок", name: "rightTitle", widget: "string" }
              - { label: "Правая колонка — текст", name: "rightText", widget: "text" }
              - { label: "Правая колонка — ссылка", name: "rightLink", widget: "string" }
              - { label: "Преимущество 1 — заголовок", name: "adv1Title", widget: "string" }
              - { label: "Преимущество 2 — заголовок", name: "adv2Title", widget: "string" }
              - { label: "Преимущество 3 — заголовок", name: "adv3Title", widget: "string" }
              - { label: "Преимущество 4 — заголовок", name: "adv4Title", widget: "string" }
              - { label: "Партнёры — надстрочник", name: "partnersEyebrow", widget: "string" }
              - { label: "Партнёры — заголовок", name: "partnersTitle", widget: "string" }
              - { label: "Материалы — подпись (можно HTML)", name: "materialsCaption", widget: "text" }
              - { label: "Бренды — подпись (можно HTML)", name: "brandsCaption", widget: "text" }
              - { label: "Фактуры — подпись (можно HTML)", name: "swatchesCaption", widget: "text" }

