backend:
  name: github
  repo: stastitov002-arch/4060-site
  branch: main
  base_url: https://white-sound-877adecap-proxy.stas-titov-002.workers.dev
  auth_endpoint: /auth

# Глобальные правила генерации слагов.
# Применяются и к именам файлов проектов, и к загружаемым фото.
slug:
  encoding: ascii           # только ASCII (a-z, 0-9, дефис, подчёркивание, тильда)
  clean_accents: true       # é→e, ü→u, а также транслитерация (ß→ss и т.д.)
  sanitize_replacement: "-" # недопустимые символы → дефис
  trim: true                # убирать дефисы по краям
  lowercase: true           # всё в нижний регистр

media_folder: "images/uploads"
public_folder: "images/uploads"

# Главное: автоматическое переименование загружаемых файлов.
# Без этой опции Sveltia сохраняет оригинальные имена (с пробелами и кириллицей).
media_libraries:
  default:
    config:
      slugify_filename: true   # ← вот эта опция включает переименование

collections:
  # ============================================
  # ПРОЕКТЫ (портфолио + главная)
  # ============================================
  - name: "projects"
    label: "Проекты"
    label_singular: "Проект"
    folder: "_projects"
    create: true
    identifier_field: "title"
    slug: "{{fields.slug}}"
    summary: "{{title}} {% if featured %}★ на главной{% endif %}"
    description: "Заполни поле «Слаг» латиницей — это имя файла. Остальное можно писать по-русски."
    fields:
      - label: "Слаг (имя файла, латиница)"
        name: "slug"
        widget: "string"
        hint: "Только латиница, цифры и дефис. Например: kitchen-modern-01. Без пробелов, без русских букв."
        pattern: ['^[a-z0-9\-]+$', 'Только латиница, цифры и дефис']
      - { label: "Название проекта", name: "title", widget: "string" }
      - { label: "Показать на главной", name: "featured", widget: "boolean", default: false, required: false, hint: "Максимум 4 проекта" }
      - { label: "Стиль", name: "style", widget: "string", required: false }
      - { label: "Планировка", name: "layout", widget: "string", required: false }
      - label: "Материал фасада"
        name: "material"
        widget: "select"
        required: false
        hint: "Выбери из списка — этот материал появится в фильтре портфолио."
        options:
          - "ЛДСП"
          - "AGT"
          - "Пленка ПВХ"
          - "Пластик"
          - "ALVIC Luxe"
          - "Массив"
          - "Шпон"
          - "Эмаль"
      - { label: "Цена", name: "price", widget: "number", required: false }
      - { label: "Описание", name: "description", widget: "text" }
      - { label: "Главное фото", name: "cover", widget: "image" }
      - { label: "Галерея (2–5 фото)", name: "gallery", widget: "list", required: false, field: { label: "Фото", name: "image", widget: "image" } }
      - { label: "Фасады и материалы (подробно)", name: "facades", widget: "text", required: false, hint: "Текстовое описание — краска, декор, толщина. Не влияет на фильтр." }
      - { label: "Столешница", name: "countertop", widget: "text", required: false }
      - { label: "Фурнитура", name: "hardware", widget: "text", required: false }
      - { label: "Комплектация", name: "equipment", widget: "text", required: false }

  # ============================================
  # НАСТРОЙКИ САЙТА (тексты, телефоны, кнопки)
  # ============================================
  - name: "settings"
    label: "Настройки сайта"
    files:
      - name: "site"
        label: "Тексты и контакты"
        file: "_data/site.json"
        fields:
          - label: "Общее (шапка, футер)"
            name: "common"
            widget: "object"
            fields:
              - { label: "Телефон 1", name: "phone1", widget: "string" }
              - { label: "Телефон 2", name: "phone2", widget: "string" }
              - { label: "Часы работы", name: "hours", widget: "string" }
              - { label: "Telegram (username без @)", name: "tg", widget: "string" }
              - { label: "Текст в подвале", name: "tagline", widget: "text" }
              - { label: "Копирайт", name: "copyright", widget: "string" }

          - label: "Главная — Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Надстрочник", name: "eyebrow", widget: "string" }
              - { label: "Заголовок (можно HTML)", name: "title", widget: "text" }
              - { label: "Подзаголовок (можно HTML)", name: "subtitle", widget: "text" }
              - { label: "Бейдж 1", name: "badge1", widget: "string" }
              - { label: "Бейдж 2", name: "badge2", widget: "string" }
              - { label: "Бейдж 3", name: "badge3", widget: "string" }
              - { label: "Бейдж 4", name: "badge4", widget: "string" }
              - { label: "Кнопка 1", name: "btn1", widget: "string" }
              - { label: "Кнопка 2", name: "btn2", widget: "string" }
              - { label: "Текст «Скролл»", name: "scroll", widget: "string" }

          - label: "Главная — Портфолио"
            name: "homePortfolio"
            widget: "object"
            fields:
              - { label: "Надстрочник", name: "eyebrow", widget: "string" }
              - { label: "Заголовок", name: "title", widget: "string" }
              - { label: "Описание", name: "subtitle", widget: "text" }
              - { label: "Заголовок CTA-блока (можно HTML)", name: "ctaTitle", widget: "text" }
              - { label: "Описание CTA-блока", name: "ctaSub", widget: "text" }
              - { label: "Кнопка CTA", name: "ctaBtn", widget: "string" }

          - label: "Главная — Шоурум"
            name: "showroom"
            widget: "object"
            fields:
              - { label: "Надстрочник", name: "eyebrow", widget: "string" }
              - { label: "Заголовок", name: "title", widget: "string" }
              - { label: "Описание", name: "text", widget: "text" }
              - { label: "Текст бейджа", name: "badge", widget: "string" }
              - { label: "Кнопка", name: "btn", widget: "string" }

          - label: "Главная — Проект под ключ"
            name: "tpk"
            widget: "object"
            fields:
              - { label: "Надстрочник", name: "eyebrow", widget: "string" }
              - { label: "Заголовок", name: "title", widget: "string" }
              - { label: "Описание", name: "subtitle", widget: "string" }

          - label: "Главная — Этапы работы"
            name: "steps"
            widget: "object"
            fields:
              - { label: "Заголовок", name: "title", widget: "string" }
              - { label: "Описание", name: "lead", widget: "string" }

          - label: "Главная — FAQ"
            name: "faq"
            widget: "object"
            fields:
              - { label: "Заголовок", name: "title", widget: "string" }
              - { label: "Описание", name: "subtitle", widget: "string" }

          - label: "Форма замера"
            name: "form"
            widget: "object"
            fields:
              - { label: "Бейдж", name: "badge", widget: "string" }
              - { label: "Заголовок", name: "title", widget: "string" }
              - { label: "Описание", name: "lead", widget: "text" }
              - { label: "Надстрочник формы", name: "eyebrow", widget: "string" }
